# RestoreProof — Portainer-safe stack (keep this simple)
# Author: Doug Hesseltine
# Created: 2026-07-12
# Modified: 2026-10-01
# Version: 1.6.7
#
# In Portainer Environment variables, set EXACTLY these two names:
#   SECRET_KEY
#   POSTGRES_PASSWORD
#
# Do not use API_SECRET_KEY / WORKER_SECRET_KEY with this file.
# Do not put # & % in POSTGRES_PASSWORD.
# Generate: openssl rand -hex 32   and   openssl rand -hex 24

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restoreproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: restoreproof
    volumes:
      - rp_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: yesitsmedoug/restoreproof-api:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://restoreproof:${POSTGRES_PASSWORD}@db:5432/restoreproof
      SECRET_KEY: ${SECRET_KEY}
      DATA_DIR: /data
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3080}
    volumes:
      - rp_data:/data
      - rp_ssh:/root/.ssh
    depends_on:
      - db
    restart: unless-stopped

  worker:
    image: yesitsmedoug/restoreproof-api:latest
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://restoreproof:${POSTGRES_PASSWORD}@db:5432/restoreproof
      SECRET_KEY: ${SECRET_KEY}
      DATA_DIR: /data
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3080}
    volumes:
      - rp_data:/data
      - rp_ssh:/root/.ssh
    depends_on:
      - db
      - api
    restart: unless-stopped

  web:
    image: yesitsmedoug/restoreproof-web:latest
    ports:
      - "3080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  rp_pgdata:
  rp_data:
  rp_ssh:
